name: Snyk Security (Dependencies Only)

on:
  push:
    branches: ['v5-stable']
  pull_request:
    branches: ['v5-stable']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install dependencies
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 2. Install Snyk CLI
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 3. Run Dependency Scan (SCA)
      # --sarif-file-output: Generates the format GitHub needs
      # --all-projects: Finds all manifest files (npm, pip, etc.)
      # --exclude=android: Skip android gradle projects
      # || true: Prevents the job from failing so the upload step can run
      - name: Snyk Open Source test
        run: snyk test --all-projects --exclude=android --sarif-file-output=snyk-deps.sarif || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 3. Upload Results to GitHub Security Tab
      - name: Upload Snyk Dependency results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-deps.sarif
          # Removing 'category: snyk-dependencies' allows GitHub to
          # handle multiple project runs within the same file.
