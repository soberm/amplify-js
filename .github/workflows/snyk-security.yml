name: Snyk Security (Dependencies Only)

on:
  push:
    branches: ['v5-stable']
  pull_request:
    branches: ['v5-stable']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install dependencies
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 2. Install Snyk CLI
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 3. Scan main customer-facing packages (under 20 limit)
      - name: Snyk Open Source test
        run: |
          snyk test \
            --file=package.json \
            --file=packages/amazon-cognito-identity-js/package.json \
            --file=packages/analytics/package.json \
            --file=packages/api/package.json \
            --file=packages/api-graphql/package.json \
            --file=packages/api-rest/package.json \
            --file=packages/auth/package.json \
            --file=packages/aws-amplify/package.json \
            --file=packages/aws-amplify-react-native/package.json \
            --file=packages/cache/package.json \
            --file=packages/core/package.json \
            --file=packages/datastore/package.json \
            --file=packages/datastore-storage-adapter/package.json \
            --file=packages/geo/package.json \
            --file=packages/interactions/package.json \
            --file=packages/notifications/package.json \
            --file=packages/predictions/package.json \
            --file=packages/pubsub/package.json \
            --file=packages/pushnotification/package.json \
            --file=packages/storage/package.json \
            --sarif-file-output=snyk-deps.sarif || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 4. Upload Results to GitHub Security Tab
      - name: Upload Snyk results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-deps.sarif
