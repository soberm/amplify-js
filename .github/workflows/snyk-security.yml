name: Snyk Security (Dependencies Only)

on:
  push:
    branches: ['v5-stable']
  pull_request:
    branches: ['v5-stable']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install dependencies
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 2. Install Snyk CLI
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 3. Run Dependency Scan on all projects
      - name: Snyk Open Source test
        run: snyk test --all-projects --exclude=android,docs --sarif-file-output=snyk-deps.sarif || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 4. Merge SARIF runs to comply with GitHub's 20-run limit
      - name: Merge SARIF runs
        run: |
          if [ -f "snyk-deps.sarif" ]; then
            RUN_COUNT=$(jq '.runs | length' snyk-deps.sarif)
            echo "Found $RUN_COUNT runs in SARIF file"
            
            if [ "$RUN_COUNT" -gt 20 ]; then
              echo "Merging $RUN_COUNT runs into a single run..."
              
              jq '{
                version: .version,
                "$schema": ."$schema",
                runs: [
                  ({
                    tool: .runs[0].tool,
                    results: [.runs[].results[]] | unique_by(.ruleId + .locations[0].physicalLocation.artifactLocation.uri)
                  } + (
                    [.runs[].originalUriBaseIds] | 
                    map(select(. != null)) | 
                    if length > 0 then {originalUriBaseIds: .[0]} else {} end
                  ))
                ]
              }' snyk-deps.sarif > snyk-merged.sarif
              
              mv snyk-merged.sarif snyk-deps.sarif
              NEW_COUNT=$(jq '.runs[0].results | length' snyk-deps.sarif)
              echo "Merged into 1 run with $NEW_COUNT unique results"
            fi
          fi

      # 5. Upload Results to GitHub Security Tab
      - name: Upload Snyk results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-deps.sarif
