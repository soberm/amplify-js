name: Snyk Security (Dependencies Only)

on:
  push:
    branches: ['v5-stable']
  pull_request:
    branches: ['v5-stable']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install Snyk CLI
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 2. Run Dependency Scan (SCA)
      # --sarif: Generates the format GitHub needs
      # --all-projects: Finds all manifest files (npm, pip, etc.)
      # || true: Prevents the job from failing so the upload step can run
      - name: Snyk Open Source test
        run: snyk test --all-projects --sarif > snyk-deps.sarif || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 3. Upload Results to GitHub Security Tab
      - name: Upload Snyk Dependency results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-deps.sarif
          category: snyk-dependencies

      # 4. Push snapshot to Snyk Dashboard (for continuous monitoring)
      - name: Snyk Open Source monitor
        run: snyk monitor --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
